<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">
    <title>Einfache Web-Weltkarte</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        #map {
            height: 450px;
            width: 100%;
            border-radius: 8px;
        }
    </style>
</head>

<body>
    <h3>Live-Kartenansicht</h3>
    <div id="map"></div>

    <!-- Leaflet JavaScript -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Karte initialisieren und auf Mitteleuropa ausrichten (Breite, Länge, Zoom)
        const map = L.map('map').setView([47.8, 13.0], 4);
         // 1. Einzelnen Marker setzen
        const lat = 47.8128;
        const lng = 13.0456;
        const marker = L.marker([lat, lng]).addTo(map);
        marker.bindPopup('<b>Salzburg Hauptbahnhof</b><br>Koordinate: 47.8128, 13.0456');

        // 2. Mehrere Punkte aus einer Liste (Array) als Kreise einzeichnen
        const standorte = [
            { ort: 'Wien', lat: 48.2082, lng: 16.3738, anzahl: 15},
            { ort: 'Berlin', lat: 52.5200, lng: 13.4050, anzahl: 28 },
            { ort: 'München', lat: 48.1351, lng: 11.5820, anzahl: 12 }
        ];



        // Kostenlose OpenStreetMap-Kacheln als Hintergrundkarte einhängen
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 18,
            attribution: '&copy; OpenStreetMap'
        }).addTo(map);



        standorte.forEach(p => {
            L.circleMarker([p.lat, p.lng], {
                radius: 7,
                color: '#c2410c',
                fillColor: '#ea580c',
                fillOpacity: 0.8
            }).addTo(map).bindPopup(`<b>${p.ort}</b><br>Ereignisse: ${p.anzahl} kann ich schreiben was notwendig ist`);
        });

    </script>
</body>

</html>
